        :root {
            --primary-color: #1f4e79;
            --accent-color: #2b78e4;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #e0e6ed;
            --highlight-bg: #e2efda;
            --highlight-text: #276749;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .search-section {
            padding: 25px 25px 15px 25px;
        }

        .search-box-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .search-label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary-color);
        }

        .search-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafbfc;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px rgba(43, 120, 228, 0.15);
            background-color: #fff;
        }

        .results-count {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            padding: 0 25px 30px 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            padding: 14px 16px;
            font-size: 15px;
            font-weight: 700;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:nth-child(even) {
            background-color: #f8fafc;
        }

        tbody tr:hover {
            background-color: #edf2f7;
        }

        .badge-sector {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            background-color: #e2e8f0;
            color: #4a5568;
            font-weight: 600;
            font-size: 13px;
        }

        .price-tag {
            font-weight: 800;
            color: var(--highlight-text);
            background-color: var(--highlight-bg);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
            font-size: 16px;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #e53e3e;
            font-size: 16px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 20px; }
            .search-input { font-size: 16px; padding: 12px 15px; }
            th, td { padding: 10px 12px; font-size: 14px; }
        }
    </style>
</head>

    ];

    const searchInput = document.getElementById('searchInput');
    const resultsBody = document.getElementById('resultsBody');
    const resultsCount = document.getElementById('resultsCount');
    const noResults = document.getElementById('noResults');

    // دالة توحيد الحروف العربية للبحث المرن
    function normalizeArabic(text) {
        if (!text) return '';
        return String(text)
            .trim()
            .toLowerCase()
            .replace(/[أإآءئؤ]/g, 'ا')
            .replace(/ى/g, 'ي')
            .replace(/ة/g, 'ه')
            .replace(/[ً-ْ]/g, '');
    }

    function renderTable(data) {
        resultsBody.innerHTML = '';
        if (data.length === 0) {
            noResults.style.display = 'block';
            resultsCount.textContent = 'عدد النتائج: 0';
            return;
        }

        noResults.style.display = 'none';
        resultsCount.textContent = `تم العثور على ${data.length} منطقة`;

        data.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="text-align: center; font-weight: bold; color: #718096;">${index + 1}</td>
                <td><span class="badge-sector">${item['الفرع / القطاع']}</span></td>
                <td style="font-weight: 700; color: #1a202c;">${item['اسم المنطقة']}</td>
                <td style="text-align: center;"><span class="price-tag">${item['سعر التوصيل (ج.م)']} ج.م</span></td>
            `;
            resultsBody.appendChild(tr);
        });
    }

    // فلترة مرنة وذكية تدعم الأجزاء والمتشابهات وتجاهل اختلاف الألف والياء والتاء المربوطة
    searchInput.addEventListener('input', function() {
        const query = normalizeArabic(this.value);
        if (!query) {
            renderTable(deliveryData);
            resultsCount.textContent = `عرض جميع المناطق (${deliveryData.length} منطقة)`;
            return;
        }

        const words = query.split(/\s+/).filter(w => w.length > 0);

        const filtered = deliveryData.filter(item => {
            const normalizedArea = normalizeArabic(item['اسم المنطقة']);
            const normalizedSector = normalizeArabic(item['الفرع / القطاع']);
            
            return words.every(word => normalizedArea.includes(word) || normalizedSector.includes(word));
        });

        renderTable(filtered);
    });

    // العرض الأولي لكل المناطق
    renderTable(deliveryData);
</script>

</body>
</html>
